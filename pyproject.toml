[project]
name = "mobility-insight-task"
version = "0.1.0"
description = "Grade-aware mobility ingestion and driver risk pipeline"
readme = "readme.md"
authors = [
    { name = "PeerasakIn", email = "intarapaiboon@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "openpyxl>=3.1",
    "pytest>=8.3",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mobility*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
